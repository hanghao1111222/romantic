<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Mascot Studio</title>
<style>
:root{--panel:rgba(10,14,24,.8);--line:rgba(255,255,255,.1);--text:#f5f7fb;--muted:#9aa6bd}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC",sans-serif;overflow:hidden}#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 320px}.stage{position:relative;display:flex;align-items:center;justify-content:center;background:#000}canvas{display:block;width:min(100%,calc(100vh*4/3));aspect-ratio:4/3;height:auto;max-height:100vh;cursor:grab}.panel{border-left:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);padding:20px;overflow:auto}.badge{position:absolute;left:24px;top:22px;font-size:12px;color:#aab5ca;letter-spacing:.08em}.title{position:absolute;left:24px;bottom:22px}.title h1{font-size:18px;margin:0 0 4px}.title p{font-size:12px;color:#8390a7;margin:0}h2{font-size:15px;margin:0 0 18px}.group{padding:14px 0;border-top:1px solid var(--line)}.group:first-of-type{border-top:0;padding-top:0}.label{font-size:11px;color:var(--muted);margin-bottom:9px;letter-spacing:.08em}.grid,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;border-radius:10px;padding:10px 11px;font-size:12px;cursor:pointer}button:hover{background:rgba(255,255,255,.09)}button.active{border-color:rgba(255,216,74,.65);background:rgba(255,216,74,.11)}.row{display:grid;grid-template-columns:92px 1fr 42px;gap:10px;align-items:center;margin:11px 0}.row span{font-size:12px;color:#c7d0e0}.val{text-align:right;color:#8d99af!important}input[type=range]{width:100%;accent-color:#ffd84a}.hint{font-size:11px;line-height:1.55;color:#7f8aa0}.wide{grid-column:1/-1}@media(max-width:900px){#app{grid-template-columns:1fr}.panel{position:absolute;right:12px;top:12px;width:300px;max-height:calc(100% - 24px);border:1px solid var(--line);border-radius:14px}.title{display:none}}
</style>
</head>
<body><div id="app"><div class="stage"><canvas id="c" width="1200" height="900"></canvas><div class="badge">PARTICLE MASCOT / HTML CANVAS</div><div class="title"><h1 id="sceneName">Electric Mouse</h1><p>拖动倾斜 · 鼠标视差 · 点击触发粒子散开</p></div></div><aside class="panel"><div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;"><a href="index.html" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px; padding:7px 12px; background:rgba(255,100,150,0.16); border:1px solid rgba(255,100,150,0.5); color:#ff9ebb; border-radius:8px; font-weight:600; font-size:12px; transition:all 0.2s;" onmouseover="this.style.background='rgba(255,100,150,0.3)'" onmouseout="this.style.background='rgba(255,100,150,0.16)'">🌹 3D Flower Lab</a><span style="font-size:11px; color:#8d99af;">Hub Portal</span></div><h2>Particle Mascot Studio</h2><div class="group"><div class="label">角色预设</div><div class="grid"><button class="preset active" data-preset="pikachu">电气鼠</button><button class="preset" data-preset="bunny">蓝色兔子</button><button class="preset" data-preset="kitten">粉色小猫</button><button class="preset" data-preset="fox">紫色小狐</button></div></div><div class="group"><div class="label">动态参数</div><div class="row"><span>粒子密度</span><input id="density" type="range" min="0.5" max="1.7" step="0.05" value="1.05"><span class="val" id="densityV">1.05</span></div><div class="row"><span>漂移强度</span><input id="flow" type="range" min="0" max="2" step="0.05" value="0.65"><span class="val" id="flowV">0.65</span></div><div class="row"><span>光晕</span><input id="glow" type="range" min="0" max="2.5" step="0.05" value="1.25"><span class="val" id="glowV">1.25</span></div><div class="row"><span>电弧/能量</span><input id="energy" type="range" min="0" max="2" step="0.05" value="1.15"><span class="val" id="energyV">1.15</span></div><div class="row"><span>呼吸速度</span><input id="speed" type="range" min="0.2" max="2" step="0.05" value="0.75"><span class="val" id="speedV">0.75</span></div></div><div class="group"><div class="label">画面</div><div class="actions"><button id="burst">粒子散开一次</button><button id="reset">恢复视角</button><button id="pause">暂停</button><button id="clean">纯画面</button><button class="wide" id="save">保存当前 PNG</button></div></div><div class="group"><div class="label">说明</div><div class="hint">纯 HTML + Canvas 代码生成，不依赖图片素材。电气鼠预设使用黄色粒子、红色脸颊、黑色耳尖、闪电尾巴和电弧效果。可继续扩展你自己的原创 IP。</div></div></aside></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),W=canvas.width,H=canvas.height;
const state={preset:'pikachu',density:1.05,flow:.65,glow:1.25,energy:1.15,speed:.75,paused:false,clean:false,tiltX:0,tiltY:0,targetTiltX:0,targetTiltY:0,burst:0,t:0};
const palettes={pikachu:{main:'#ffd83d',light:'#fff4a3',dark:'#c99d00',accent:'#ff4058',eye:'#0f1012',edge:'#fff7c8'},bunny:{main:'#42a6ff',light:'#d8f2ff',dark:'#1759b4',accent:'#9ceaff',eye:'#061529',edge:'#dff7ff'},kitten:{main:'#ff8fc4',light:'#ffe0ef',dark:'#b94a82',accent:'#ffc46b',eye:'#28101f',edge:'#fff0f6'},fox:{main:'#a476ff',light:'#eadfff',dark:'#5c32aa',accent:'#ff8ad8',eye:'#170d2b',edge:'#f5edff'}};
const names={pikachu:'Electric Mouse',bunny:'Blue Stardust Bunny',kitten:'Pink Nebula Kitten',fox:'Violet Spark Fox'};
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}function mix(a,b,t){a=rgb(a);b=rgb(b);return`rgb(${Math.round(a.r+(b.r-a.r)*t)},${Math.round(a.g+(b.g-a.g)*t)},${Math.round(a.b+(b.b-a.b)*t)})`}function rnd(a,b){return a+Math.random()*(b-a)}
function ellipsePoint(cx,cy,rx,ry,rot=0){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random()),x=Math.cos(a)*rx*r,y=Math.sin(a)*ry*r,c=Math.cos(rot),s=Math.sin(rot);return[cx+x*c-y*s,cy+x*s+y*c]}function ellipseEdge(cx,cy,rx,ry,rot=0){let a=Math.random()*Math.PI*2,x=Math.cos(a)*rx,y=Math.sin(a)*ry,c=Math.cos(rot),s=Math.sin(rot);return[cx+x*c-y*s,cy+x*s+y*c]}
function polyContains(p,poly){let x=p[0],y=p[1],inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1],hit=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-9)+xi);if(hit)inside=!inside}return inside}function polyPoint(poly){let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const[x,y]of poly){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}for(let k=0;k<500;k++){let p=[rnd(minX,maxX),rnd(minY,maxY)];if(polyContains(p,poly))return p}return poly[0]}
let particles=[],lines=[];function addCloud(count,sampler,a,b,alpha=.9,zr=[-1,1],size=[.7,2],tag='body'){count=Math.floor(count*state.density);for(let i=0;i<count;i++){let[x,y]=sampler();particles.push({x,y,z:rnd(zr[0],zr[1]),ox:x,oy:y,size:rnd(size[0],size[1]),phase:rnd(0,6.28),color:Math.random()<.5?a:b,alpha:rnd(alpha*.55,alpha),tag})}}function addEdge(count,sampler,color,alpha=.95,size=[.7,1.7],tag='edge'){count=Math.floor(count*state.density);for(let i=0;i<count;i++){let[x,y]=sampler();particles.push({x,y,z:rnd(-.4,.4),ox:x,oy:y,size:rnd(size[0],size[1]),phase:rnd(0,6.28),color,alpha:rnd(alpha*.7,alpha),tag})}}function addLine(points,color,width=1,alpha=.6){lines.push({points,color,width,alpha})}
function face(p,kind){addCloud(620,()=>ellipsePoint(548,425,24,31),p.eye,'#27303a',.98,[-.1,.1],[.9,1.8],'eye');addCloud(620,()=>ellipsePoint(652,425,24,31),p.eye,'#27303a',.98,[-.1,.1],[.9,1.8],'eye');addCloud(130,()=>ellipsePoint(541,414,7,9),'#fff','#fff',1,[0,0],[1,2],'spark');addCloud(130,()=>ellipsePoint(645,414,7,9),'#fff','#fff',1,[0,0],[1,2],'spark');addCloud(100,()=>ellipsePoint(600,464,8,6),kind==='kitten'?'#ff6ea8':'#ffc4d8','#fff',.95,[0,0],[1,1.7],'nose');addLine([[600,471],[588,480],[577,477]],p.edge,1,.5);addLine([[600,471],[612,480],[623,477]],p.edge,1,.5)}
function buildPikachu(p){const cx=600,cy=435,earL=[[492,310],[444,88],[525,248],[548,335]],earR=[[708,310],[756,88],[675,248],[652,335]],tipL=[[444,88],[470,178],[501,166],[492,116]],tipR=[[756,88],[730,178],[699,166],[708,116]];addCloud(1300,()=>polyPoint(earL),p.main,p.light,.92,[-.3,.4],[.7,1.8],'ear');addCloud(1300,()=>polyPoint(earR),p.main,p.light,.92,[-.3,.4],[.7,1.8],'ear');addCloud(460,()=>polyPoint(tipL),p.eye,'#343434',.95,[-.2,.3],[.8,1.8],'earTip');addCloud(460,()=>polyPoint(tipR),p.eye,'#343434',.95,[-.2,.3],[.8,1.8],'earTip');addCloud(7200,()=>ellipsePoint(cx,cy,160,130),p.main,p.light,.95,[-1,1.2],[.6,2.2],'head');addEdge(1900,()=>ellipseEdge(cx,cy,160,130),p.edge,.8,[.6,1.4],'headEdge');addCloud(6500,()=>ellipsePoint(cx,635,132,145),p.main,p.dark,.9,[-1.2,1.3],[.6,2.1],'body');addCloud(1500,()=>ellipsePoint(525,620,42,92,-.28),p.main,p.light,.9,[-.5,.6],[.7,1.8],'arm');addCloud(1500,()=>ellipsePoint(675,620,42,92,.28),p.main,p.light,.9,[-.5,.6],[.7,1.8],'arm');addCloud(1000,()=>ellipsePoint(535,770,67,32,-.08),p.main,p.light,.9,[-.4,.4],[.7,1.7],'foot');addCloud(1000,()=>ellipsePoint(665,770,67,32,.08),p.main,p.light,.9,[-.4,.4],[.7,1.7],'foot');addCloud(650,()=>ellipsePoint(548,420,23,31),p.eye,'#27303a',.98,[-.1,.1],[.9,1.8],'eye');addCloud(650,()=>ellipsePoint(652,420,23,31),p.eye,'#27303a',.98,[-.1,.1],[.9,1.8],'eye');addCloud(130,()=>ellipsePoint(541,410,7,9),'#fff','#fff',1,[0,0],[1,2.2],'spark');addCloud(130,()=>ellipsePoint(645,410,7,9),'#fff','#fff',1,[0,0],[1,2.2],'spark');addCloud(650,()=>ellipsePoint(505,486,32,28),p.accent,'#ff7180',.98,[-.1,.1],[.8,2],'cheek');addCloud(650,()=>ellipsePoint(695,486,32,28),p.accent,'#ff7180',.98,[-.1,.1],[.8,2],'cheek');addCloud(90,()=>ellipsePoint(600,462,7,5),p.eye,p.eye,1,[0,0],[1,1.8],'nose');addLine([[600,468],[588,479],[576,474]],'#5d3824',1.2,.7);addLine([[600,468],[612,479],[624,474]],'#5d3824',1.2,.7);const tail=[[717,600],[805,548],[772,499],[860,448],[825,530],[872,566],[782,621],[815,680],[746,668]];addCloud(2800,()=>polyPoint(tail),p.main,p.light,.95,[-.6,.8],[.65,2],'tail');}
function buildBunny(p){addCloud(6000,()=>ellipsePoint(600,445,150,130),p.main,p.light,.93,[-1,1.1],[.6,2.1],'head');addCloud(2400,()=>ellipsePoint(515,220,62,170,-.18),p.main,p.light,.9,[-.5,.6],[.7,1.9],'ear');addCloud(2400,()=>ellipsePoint(685,220,62,170,.18),p.main,p.light,.9,[-.5,.6],[.7,1.9],'ear');addCloud(6200,()=>ellipsePoint(600,655,132,145),p.main,p.dark,.9,[-1,1.2],[.6,2],'body');addCloud(900,()=>ellipsePoint(748,692,48,48),p.light,'#fff',.92,[-.3,.4],[.8,2],'tail');face(p,'bunny')}
function buildKitten(p){const a=[[480,348],[500,210],[560,335]],b=[[720,348],[700,210],[640,335]];addCloud(1100,()=>polyPoint(a),p.main,p.light,.95,[-.4,.4],[.7,1.9],'ear');addCloud(1100,()=>polyPoint(b),p.main,p.light,.95,[-.4,.4],[.7,1.9],'ear');addCloud(6500,()=>ellipsePoint(600,438,158,135),p.main,p.light,.93,[-1,1.1],[.6,2.1],'head');addCloud(6100,()=>ellipsePoint(600,650,128,150),p.main,p.dark,.88,[-1,1.2],[.6,2],'body');addCloud(1500,()=>ellipsePoint(487,687,47,120,-.5),p.main,p.light,.88,[-.5,.6],[.7,1.7],'tail');face(p,'kitten')}
function buildFox(p){const a=[[470,346],[490,170],[555,326]],b=[[730,346],[710,170],[645,326]];addCloud(1300,()=>polyPoint(a),p.main,p.light,.95,[-.4,.4],[.7,1.9],'ear');addCloud(1300,()=>polyPoint(b),p.main,p.light,.95,[-.4,.4],[.7,1.9],'ear');addCloud(6200,()=>ellipsePoint(600,435,156,132),p.main,p.light,.93,[-1,1.1],[.6,2.1],'head');addCloud(6000,()=>ellipsePoint(600,650,125,148),p.main,p.dark,.9,[-1,1.2],[.6,2],'body');addCloud(2700,()=>ellipsePoint(765,680,88,140,.4),p.main,p.light,.9,[-.7,.8],[.7,2],'tail');addCloud(900,()=>ellipsePoint(600,494,78,42),p.light,'#fff',.9,[-.2,.2],[.7,1.7],'muzzle');face(p,'fox')}
function build(){particles=[];lines=[];let p=palettes[state.preset];({pikachu:buildPikachu,bunny:buildBunny,kitten:buildKitten,fox:buildFox}[state.preset])(p);document.getElementById('sceneName').textContent=names[state.preset]}
function project(pt,now){let x=pt.x-600,y=pt.y-450,z=pt.z*38,ay=state.tiltY*.65,ax=state.tiltX*.45,x1=x*Math.cos(ay)+z*Math.sin(ay),z1=-x*Math.sin(ay)+z*Math.cos(ay),y1=y*Math.cos(ax)-z1*Math.sin(ax);z1=y*Math.sin(ax)+z1*Math.cos(ax);let s=1+z1/1800,pulse=1+Math.sin(now*.0013*state.speed)*.007;return[600+x1*s*pulse,450+y1*s*pulse,s]}
function bg(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let p=rgb(palettes[state.preset].main),g=ctx.createRadialGradient(600,440,40,600,440,500);g.addColorStop(0,`rgba(${p.r},${p.g},${p.b},.05)`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function energy(now){let p=palettes[state.preset],e=state.energy;if(e<.01)return;ctx.save();ctx.globalCompositeOperation='lighter';let branches=state.preset==='pikachu'?7:4;for(let b=0;b<branches;b++){if(Math.random()>.32)continue;let a=b/branches*Math.PI*2+Math.sin(now*.001+b)*.4,r0=state.preset==='pikachu'?175:160,r1=r0+rnd(55,150)*e,x0=600+Math.cos(a)*r0,y0=440+Math.sin(a)*r0*.75;ctx.beginPath();ctx.moveTo(x0,y0);for(let i=1;i<=8;i++){let t=i/8;ctx.lineTo(600+Math.cos(a)*(r0+(r1-r0)*t)+rnd(-18,18)*e,440+Math.sin(a)*(r0+(r1-r0)*t)*.75+rnd(-16,16)*e)}ctx.strokeStyle=state.preset==='pikachu'?'rgba(255,232,74,.55)':mix(p.main,p.light,.7);ctx.globalAlpha=.15+.25*e;ctx.lineWidth=1;ctx.shadowBlur=18*e;ctx.shadowColor=p.main;ctx.stroke()}ctx.restore()}
function draw(now){if(!state.paused)state.t+=1/60;state.tiltX+=(state.targetTiltX-state.tiltX)*.055;state.tiltY+=(state.targetTiltY-state.tiltY)*.055;state.burst*=.965;bg();let flow=state.flow,glow=state.glow,burst=state.burst,list=particles.map(pt=>{let ang=Math.atan2(pt.oy-450,pt.ox-600),r=Math.hypot(pt.ox-600,pt.oy-450);pt.x=pt.ox+Math.sin(now*.0017*state.speed+pt.phase)*flow*2.2+Math.cos(ang)*burst*(10+r*.18);pt.y=pt.oy+Math.cos(now*.00145*state.speed+pt.phase)*flow*2.2+Math.sin(ang)*burst*(10+r*.18);return[pt,project(pt,now)]}).sort((a,b)=>a[1][2]-b[1][2]);ctx.save();ctx.globalCompositeOperation='lighter';for(const[pt,pr]of list){let[x,y,s]=pr,a=pt.alpha*(.72+.28*Math.sin(now*.002*state.speed+pt.phase));if(glow>.05&&(pt.tag==='edge'||pt.tag==='spark'||Math.random()<.035)){ctx.shadowBlur=8+12*glow;ctx.shadowColor=pt.color}else ctx.shadowBlur=0;ctx.globalAlpha=a;ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(x,y,pt.size*s,0,6.28);ctx.fill()}ctx.restore();ctx.save();ctx.globalCompositeOperation='lighter';for(const l of lines){ctx.beginPath();l.points.forEach((q,i)=>{let[x,y]=project({x:q[0],y:q[1],z:0},now);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=l.color;ctx.globalAlpha=l.alpha;ctx.lineWidth=l.width;ctx.shadowBlur=6*glow;ctx.shadowColor=l.color;ctx.stroke()}ctx.restore();energy(now);ctx.save();ctx.globalCompositeOperation='lighter';let p=palettes[state.preset];for(let i=0;i<110;i++){let a=i*12.9898,x=(Math.sin(a*2.17+state.t*.05)*.5+.5)*W,y=(Math.sin(a*1.31+state.t*.034)*.5+.5)*H;if(Math.hypot(x-600,y-450)<230)continue;ctx.globalAlpha=.08+.12*Math.sin(a+state.t*.06)**2;ctx.fillStyle=mix(p.main,p.light,(i%10)/10);ctx.beginPath();ctx.arc(x,y,.5+(i%3)*.35,0,6.28);ctx.fill()}ctx.restore();requestAnimationFrame(draw)}
document.querySelectorAll('.preset').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.preset=btn.dataset.preset;build()});[['density','density'],['flow','flow'],['glow','glow'],['energy','energy'],['speed','speed']].forEach(([id,key])=>{let el=document.getElementById(id),out=document.getElementById(id+'V');el.oninput=()=>{state[key]=+el.value;out.textContent=(+el.value).toFixed(2);if(key==='density')setTimeout(build,80)}});document.getElementById('burst').onclick=()=>state.burst=1;document.getElementById('reset').onclick=()=>{state.targetTiltX=state.targetTiltY=0;state.burst=0};document.getElementById('pause').onclick=e=>{state.paused=!state.paused;e.target.textContent=state.paused?'继续':'暂停'};document.getElementById('clean').onclick=()=>{state.clean=!state.clean;document.querySelector('.panel').style.display=state.clean?'none':'block';document.querySelector('.badge').style.display=state.clean?'none':'block';document.querySelector('.title').style.display=state.clean?'none':'block'};document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.download=`particle_${state.preset}.png`;a.href=canvas.toDataURL('image/png');a.click()};let dragging=false,lastX=0,lastY=0;canvas.onmousedown=e=>{dragging=true;lastX=e.clientX;lastY=e.clientY};window.onmouseup=()=>dragging=false;window.onmousemove=e=>{if(dragging){let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;state.targetTiltY=Math.max(-.75,Math.min(.75,state.targetTiltY+dx*.006));state.targetTiltX=Math.max(-.55,Math.min(.55,state.targetTiltX+dy*.006))}};canvas.onclick=()=>state.burst=Math.max(state.burst,.65);build();requestAnimationFrame(draw);
</script></body></html>
